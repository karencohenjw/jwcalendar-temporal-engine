name: Publish Artifact Hub repository metadata

on:
  workflow_dispatch:
    inputs:
      repository_id:
        description: Repository ID shown in the Artifact Hub control panel
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Prepare and publish repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
        run: |
          set -eu
          if ! printf '%s' "$REPOSITORY_ID" | grep -Eq '^[a-f0-9-]{36}$'; then
            echo "repository_id must be a UUID from Artifact Hub" >&2
            exit 1
          fi
          printf 'repositoryID: %s\n' "$REPOSITORY_ID" > artifacthub-repo.yml
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push ghcr.io/karencohenjw/charts/jwcalendar-temporal-engine:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
